<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nulala Family Menu — our favorite tried and true family recipes"><title>Nulala Family Menu</title>
<style>:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:#27332c;background:#faf8f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:0 24px}header{padding:24px 0;border-bottom:1px solid #e5e2d9;display:flex;align-items:center;justify-content:space-between}.logo{font-family:Georgia,serif;font-size:22px;font-weight:bold}.logo em{font-style:normal;color:#63806b}.muted{color:#737d74}.hero{padding:76px 0 45px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#617c67;font-weight:800}.hero h1{font:normal clamp(43px,8vw,80px)/1.05 Georgia,serif;letter-spacing:-.035em;margin:18px 0}.hero p{max-width:520px;line-height:1.8}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 30px}button{font:inherit;cursor:pointer}nav button{border:1px solid #dce0d7;border-radius:40px;background:white;padding:10px 18px;color:#516353}nav button.active{background:#58725c;color:white;border-color:#58725c}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}input{padding:12px 16px;border:1px solid #dadfd7;border-radius:24px;max-width:280px;width:100%;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px;margin-bottom:70px}.tile{display:block;width:100%;border:1px solid #e2e4dc;border-radius:18px;background:white;text-align:left;overflow:hidden;padding:0;transition:transform .2s}.tile:hover{transform:translateY(-3px)}.photo{height:230px;background:linear-gradient(135deg,#c6cdb7,#f6e8d1 48%,#bea27b);display:grid;place-items:center;font-size:72px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tilebody{padding:24px}.tag{color:#9b7754;font-size:12px;letter-spacing:.12em;font-weight:700}.tile h2{font:normal 30px Georgia,serif;margin:12px 0}.tile p{color:#69746b;line-height:1.7}.foot{border-top:1px solid #ecece6;margin-top:19px;padding-top:15px;display:flex;justify-content:space-between;color:#6f8171;font-size:13px}.empty{padding:52px 0;color:#748076}dialog{border:0;border-radius:20px;max-width:850px;width:calc(100% - 28px);max-height:90vh;padding:0;color:#28392d;background:#fffdfa}dialog::backdrop{background:#1d2b2199}.detail{padding:35px}.detail h2{font:normal 44px Georgia,serif;margin:12px 0}.close{float:right;border:0;border-radius:50%;background:#eaece5;width:40px;height:40px;font-size:24px}.two{display:grid;grid-template-columns:1fr 1.3fr;gap:34px}.two li{margin:0 0 12px;line-height:1.7}.two ul{padding-left:17px}.two ol{padding-left:20px}.meta{background:#edf2ea;border-radius:10px;padding:13px;color:#537059;margin:22px 0;line-height:1.7}footer{padding:28px 0 50px;border-top:1px solid #e7e6df;font-size:13px;color:#7b877c}.lang-switch{display:flex;gap:4px;background:#eef1eb;border-radius:30px;padding:4px}.lang-btn{border:0;background:transparent;border-radius:25px;padding:7px 11px;color:#586b5c;font-size:13px}.lang-btn.active{background:#58725c;color:#fff}@media(max-width:600px){.hero{padding:55px 0 25px}.two{grid-template-columns:1fr}.detail{padding:24px}.detail h2{font-size:34px}}</style></head>
<body><div class="wrap"><header><div class="logo">Nulala <em>Family Menu</em></div><div class="lang-switch" role="group" aria-label="Language"><button id="en" type="button" class="lang-btn" aria-pressed="false">English</button><button id="zh" type="button" class="lang-btn active" aria-pressed="true">中文</button></div></header>
<section class="hero"><div class="eyebrow" id="eyebrow">我们家的成功菜谱</div><h1 id="hero-title">用心制作。<br>珍藏美味。</h1><p class="muted" id="hero-description">记录每一道亲手做成功的菜，从日常正餐到烘焙。把家里的味道好好收藏，也分享给喜欢的人。</p></section>
<div class="toolbar"><nav id="tabs"><button data-tab="全部" class="active">全部</button><button data-tab="正餐">正餐</button><button data-tab="烘焙">烘焙</button></nav><input id="search" placeholder="搜索菜谱 / Search recipes" aria-label="搜索菜谱"></div>

<dialog id="dialog"><div id="details" class="detail"></div></dialog>
<script>
const recipes=[{"id":"shio-pan-v1","title":"日式海盐卷","englishTitle":"Japanese Shio Pan","category":"烘焙","version":"V1","status":"成功配方","yield":"约9个（每个60g面团）","temperature":"400°F / 204°C","bakeTime":"15–18分钟","ingredients":[["高筋面粉","300g"],["白糖","15g"],["即发干酵母","3g"],["奶粉","20g"],["盐","5.4g"],["冰水","185g"],["黄油（揉入面团）","24g"],["黄油（包入，可选）","每个5–10g"]],"steps":["除黄油外混合材料，揉至形成面筋。","加入24g黄油，继续揉至光滑、有延展性。","盖好一发，原始配方约60分钟，以体积与状态为准。","分割成每个约60g，滚圆并松弛至容易擀开。","擀成长三角形，宽端包入5–10g冰凉黄油（可选），卷起。","整形后二发，原始配方约20分钟，以蓬松状态为准。","预热400°F，烘烤15–18分钟至金黄。"],"notes":"2026-11-21确认成功。V1不要与之前4g酵母的失败尝试混淆。","photo":""},{"id":"roasted-potatoes-v1","title":"烤土豆","englishTitle":"Roasted Potatoes","category":"正餐","version":"V1","status":"待验证","yield":"未注明","temperature":"350–360°F / 177–182°C","bakeTime":"煮5分钟 + 烤30分钟","ingredients":[["土豆","适量"],["油","适量"],["腌料","按喜好"]],"steps":["土豆煮5分钟。","加入油和腌料，拌匀。","烤箱设置350–360°F，烤15分钟。","翻面，继续烤15分钟。"],"notes":"按提供的步骤记录；具体用量和成品效果尚未确认。","photo":""},{"id":"miso-black-cod-v1","title":"味噌黑鳕鱼","englishTitle":"Miso Black Cod","category":"正餐","version":"V1","status":"待确认","yield":"约1.45 lb / 658g 黑鳕鱼","temperature":"400°F / 205°C","bakeTime":"12–18分钟","ingredients":[["黑鳕鱼","1.45 lb（约658g）"],["白味噌（White Miso）","2 tbsp"],["味醂（Mirin）","1 tbsp"],["清酒（Sake，可选）","1 tbsp"],["白糖","2 tsp"],["酱油","不需要"]],"steps":["将白味噌、味醂、清酒（可选）与白糖混合均匀。","在黑鳕鱼两面薄薄涂抹味噌腌料。","放入冰箱腌制15分钟。","将烤箱预热至400°F（205°C）。","轻轻刮掉鱼表面多余的味噌酱，避免烤焦。","按鱼块厚度烤约12–18分钟；以中心温度145°F（63°C）作为食品安全参考。","想要焦糖色表面，可短暂使用上火（Broil）约1分钟，注意避免烧焦。"],"notes":"历史讨论配方，成品是否成功尚未确认。原讨论明确提到1.45 lb黑鳕鱼、2 tbsp白味噌、可腌15分钟、无需额外酱油；味醂、清酒、糖及烘烤步骤为后来整理的建议版本。","photo":""}];
const englishRecipes={"shio-pan-v1":{"title":"Japanese Shio Pan","subtitle":"Japanese Salted Butter Rolls","category":"Baking","status":"Tested & loved","yield":"About 9 rolls (60g dough each)","bakeTime":"15–18 minutes","ingredients":[["Bread flour","300g"],["Sugar","15g"],["Instant dry yeast","3g"],["Milk powder","20g"],["Salt","5.4g"],["Ice water","185g"],["Butter (mixed into dough)","24g"],["Butter (optional filling)","5–10g per roll"]],"steps":["Mix all ingredients except the butter; knead until gluten begins to develop.","Add 24g butter and knead until smooth and extensible.","Cover and let rise for the first proof, about 60 minutes in the original recipe; judge by dough volume and condition.","Divide into 60g portions, round, and rest until easy to roll out.","Roll each portion into a long triangle. Optionally put 5–10g cold butter at the wide end and roll up.","Proof shaped rolls again; the original recipe notes about 20 minutes, but use visible puffiness to judge readiness.","Preheat to 400°F (204°C) and bake for 15–18 minutes until golden."],"notes":"Confirmed successful on November 21, 2026. This V1 uses 3g yeast; do not confuse it with an earlier unsuccessful test using 4g."},"roasted-potatoes-v1":{"title":"Roasted Potatoes","subtitle":"Oven-Roasted Potatoes","category":"Meals","status":"Not yet verified","yield":"Not specified","bakeTime":"5 min boiling + 30 min roasting","ingredients":[["Potatoes","As needed"],["Oil","As needed"],["Seasoning / marinade","To taste"]],"steps":["Boil the potatoes for 5 minutes.","Add oil and seasoning; toss to coat.","Roast at 350–360°F (177–182°C) for 15 minutes.","Flip and roast for another 15 minutes."],"notes":"Recorded as provided; ingredient quantities and results have not yet been verified."},"miso-black-cod-v1":{"title":"Miso Black Cod","englishTitle":"味噌黑鳕鱼","category":"Meals","status":"Not yet verified","yield":"About 1.45 lb / 658g black cod","temperature":"400°F / 205°C","bakeTime":"12–18 minutes","ingredients":[["Black cod (sablefish)","1.45 lb (about 658g)"],["White miso","2 tbsp"],["Mirin","1 tbsp"],["Sake (optional)","1 tbsp"],["Sugar","2 tsp"],["Soy sauce","Not needed"]],"steps":["Mix the white miso, mirin, optional sake and sugar.","Brush a thin layer of the miso marinade over both sides of the fish.","Marinate in the refrigerator for 15 minutes.","Preheat the oven to 400°F (205°C).","Gently scrape off excess miso to reduce burning.","Bake for about 12–18 minutes depending on thickness; 145°F (63°C) at the center is a food-safety reference.","For a caramelized top, optionally broil for about 1 minute, watching closely."],"notes":"Previously discussed recipe; the result has not yet been confirmed successful. The original discussion confirmed 1.45 lb black cod, 2 tbsp white miso, a 15-minute marinade, and no extra soy sauce. Mirin, sake, sugar, and cooking steps were later suggested."}};
const copy={
zh:{eyebrow:"我们家的成功菜谱",hero:"用心制作。<br>珍藏美味。",description:"记录每一道亲手做成功的菜，从日常正餐到烘焙。把家里的味道好好收藏，也分享给喜欢的人。",tabs:["全部","正餐","烘焙"],search:"搜索菜谱",empty:"没有找到菜谱。",emptyMeal:"正餐菜谱正在收藏中。",ingredients:"食材",steps:"制作步骤",success:"成功配方",unverified:"待确认配方",footer:"© Nulala Family Menu · 家庭亲测成功菜谱 · 访客只读",close:"关闭"},
en:{eyebrow:"Our family's favorite recipes",hero:"Made with love.<br>Saved for later.",description:"A collection of recipes we've made and loved—from everyday meals to homemade baking. Our family table, ready to share.",tabs:["All","Meals","Baking"],search:"Search recipes",empty:"No recipes found.",emptyMeal:"Our dinner recipes are coming soon.",ingredients:"Ingredients",steps:"Method",success:"Tested & loved",unverified:"Recipe to try",footer:"© Nulala Family Menu · Family-tested recipes · View-only for visitors",close:"Close"}};
let language="zh",current="全部",activeRecipe=null;
const cards=document.getElementById("cards"),dialog=document.getElementById("dialog"),details=document.getElementById("details");
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function translated(r){const t=englishRecipes[r.id];if(language==="zh"||!t)return r;return {...r,...t,englishTitle:r.title}}
function catName(c){return language==="zh"?c:(c==="烘焙"?"Baking":"Meals")}
function changeLanguage(next){language=next;document.documentElement.lang=next==="zh"?"zh-CN":"en";const t=copy[next];document.getElementById("eyebrow").textContent=t.eyebrow;document.getElementById("hero-title").innerHTML=t.hero;document.getElementById("hero-description").textContent=t.description;document.getElementById("footer").textContent=t.footer;document.getElementById("search").placeholder=t.search;document.getElementById("search").setAttribute("aria-label",t.search);document.querySelectorAll("[data-tab]").forEach((b,i)=>b.textContent=t.tabs[i]);["en","zh"].forEach(x=>{const b=document.getElementById(x);b.classList.toggle("active",x===next);b.setAttribute("aria-pressed",String(x===next))});try{localStorage.setItem("nulala-language",next)}catch(e){}draw();if(activeRecipe){renderDetail(activeRecipe)}}
function draw(){const q=document.getElementById("search").value.trim().toLowerCase();cards.replaceChildren();const found=recipes.filter(r=>(current==="全部"||r.category===current)&&[r.title,r.englishTitle,...r.ingredients.flat(),...(englishRecipes[r.id]?.ingredients.flat()||[])].join(" ").toLowerCase().includes(q));if(!found.length){cards.append(el("p",current==="正餐"?copy[language].emptyMeal:copy[language].empty,"empty"));return}for(const raw of found){const r=translated(raw),card=el("button",undefined,"tile"),photo=el("div",undefined,"photo");if(r.photo){const img=el("img");img.src=r.photo;img.alt=r.title;photo.append(img);img.onerror=()=>{photo.replaceChildren(el("span",raw.category==="烘焙"?"🥐":"🥔"))}}else photo.append(el("span",raw.category==="正餐"?"🐟":"🥐"));const body=el("div",undefined,"tilebody");body.append(el("div",catName(raw.category).toUpperCase(),"tag"),el("h2",r.title),el("p",(language==="zh"?raw.englishTitle:raw.title)+" · "+(r.status==="待验证"?r.status:copy[language].success)));const foot=el("div",undefined,"foot");foot.append(el("span",r.version+" ✓"),el("span",r.bakeTime||""));body.append(foot);card.append(photo,body);card.onclick=()=>{activeRecipe=raw;renderDetail(raw);dialog.showModal()};cards.append(card)}}
function renderDetail(raw){const r=translated(raw),t=copy[language];details.replaceChildren();const close=el("button","×","close");close.setAttribute("aria-label",t.close);close.onclick=()=>dialog.close();details.append(close,el("div",catName(raw.category)+" · "+r.version+" · "+(r.status==="待验证"?r.status:t.success),"eyebrow"),el("h2",r.title),el("p",language==="zh"?raw.englishTitle:raw.title,"muted"));details.append(el("div",r.yield+" | "+r.temperature+" | "+r.bakeTime,"meta"));const two=el("div",undefined,"two"),left=el("section"),right=el("section");left.append(el("h3",t.ingredients));const ul=el("ul");r.ingredients.forEach(([n,a])=>ul.append(el("li",n+" — "+a)));left.append(ul);right.append(el("h3",t.steps));const ol=el("ol");r.steps.forEach(step=>ol.append(el("li",step)));right.append(ol);two.append(left,right);details.append(two,el("p",r.notes,"meta"))}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{current=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));draw()});
document.getElementById("search").oninput=draw;dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
document.getElementById("en").onclick=()=>changeLanguage("en");document.getElementById("zh").onclick=()=>changeLanguage("zh");
dialog.addEventListener("close",()=>activeRecipe=null);
let preferred="zh";try{preferred=localStorage.getItem("nulala-language")||"zh"}catch(e){}changeLanguage(preferred==="en"?"en":"zh");
</script></body></html>
