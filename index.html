<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nulala Family Menu — our favorite tried and true family recipes"><title>Nulala Family Menu</title>
<style>:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:#27332c;background:#faf8f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:0 24px}header{padding:24px 0;border-bottom:1px solid #e5e2d9;display:flex;align-items:center;justify-content:space-between}.logo{font-family:Georgia,serif;font-size:22px;font-weight:bold}.logo em{font-style:normal;color:#63806b}.muted{color:#737d74}.hero{padding:76px 0 45px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#617c67;font-weight:800}.hero h1{font:normal clamp(43px,8vw,80px)/1.05 Georgia,serif;letter-spacing:-.035em;margin:18px 0}.hero p{max-width:520px;line-height:1.8}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 30px}button{font:inherit;cursor:pointer}nav button{border:1px solid #dce0d7;border-radius:40px;background:white;padding:10px 18px;color:#516353}nav button.active{background:#58725c;color:white;border-color:#58725c}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}input{padding:12px 16px;border:1px solid #dadfd7;border-radius:24px;max-width:280px;width:100%;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px;margin-bottom:70px}.tile{display:block;width:100%;border:1px solid #e2e4dc;border-radius:18px;background:white;text-align:left;overflow:hidden;padding:0;transition:transform .2s}.tile:hover{transform:translateY(-3px)}.photo{height:230px;background:linear-gradient(135deg,#c6cdb7,#f6e8d1 48%,#bea27b);display:grid;place-items:center;font-size:72px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tilebody{padding:24px}.tag{color:#9b7754;font-size:12px;letter-spacing:.12em;font-weight:700}.tile h2{font:normal 30px Georgia,serif;margin:12px 0}.tile p{color:#69746b;line-height:1.7}.foot{border-top:1px solid #ecece6;margin-top:19px;padding-top:15px;display:flex;justify-content:space-between;color:#6f8171;font-size:13px}.empty{padding:52px 0;color:#748076}dialog{border:0;border-radius:20px;max-width:850px;width:calc(100% - 28px);max-height:90vh;padding:0;color:#28392d;background:#fffdfa}dialog::backdrop{background:#1d2b2199}.detail{padding:35px}.detail h2{font:normal 44px Georgia,serif;margin:12px 0}.close{float:right;border:0;border-radius:50%;background:#eaece5;width:40px;height:40px;font-size:24px}.two{display:grid;grid-template-columns:1fr 1.3fr;gap:34px}.two li{margin:0 0 12px;line-height:1.7}.two ul{padding-left:17px}.two ol{padding-left:20px}.meta{background:#edf2ea;border-radius:10px;padding:13px;color:#537059;margin:22px 0;line-height:1.7}footer{padding:28px 0 50px;border-top:1px solid #e7e6df;font-size:13px;color:#7b877c}@media(max-width:600px){.hero{padding:55px 0 25px}.two{grid-template-columns:1fr}.detail{padding:24px}.detail h2{font-size:34px}}</style></head>
<body><div class="wrap"><header><div class="logo">Nulala <em>Family Menu</em></div><small class="muted">Our Home Table ♡</small></header>
<section class="hero"><div class="eyebrow">Our family's favorite recipes</div><h1>Made with love.<br>Saved for later.</h1><p class="muted">记录每一道亲手做成功的菜，从日常正餐到烘焙。把家里的味道好好收藏，也分享给喜欢的人。</p></section>
<div class="toolbar"><nav id="tabs"><button data-tab="全部" class="active">全部 All</button><button data-tab="正餐">正餐 Meals</button><button data-tab="烘焙">烘焙 Baking</button></nav><input id="search" placeholder="搜索菜谱 / Search recipes" aria-label="搜索菜谱"></div>
<main id="cards" class="grid"></main><footer>© Nulala Family Menu · Family-tested recipes · View-only for visitors</footer></div>
<dialog id="dialog"><div id="details" class="detail"></div></dialog>
<script>
let recipes=[{"id":"shio-pan-v1","title":"日式海盐卷","englishTitle":"Japanese Shio Pan","category":"烘焙","version":"V1","status":"成功配方","yield":"约9个（每个60g面团）","temperature":"400°F / 204°C","bakeTime":"15–18分钟","ingredients":[["高筋面粉","300g"],["白糖","15g"],["即发干酵母","3g"],["奶粉","20g"],["盐","5.4g"],["冰水","185g"],["黄油（揉入面团）","24g"],["黄油（包入，可选）","每个5–10g"]],"steps":["除黄油外混合材料，揉至形成面筋。","加入24g黄油，继续揉至光滑、有延展性。","盖好一发，原始配方约60分钟，以体积与状态为准。","分割成每个约60g，滚圆并松弛至容易擀开。","擀成长三角形，宽端包入5–10g冰凉黄油（可选），卷起。","整形后二发，原始配方约20分钟，以蓬松状态为准。","预热400°F，烘烤15–18分钟至金黄。"],"notes":"2026-11-21确认成功。V1不要与之前4g酵母的失败尝试混淆。","photo":""}];let current="全部";const cards=document.getElementById("cards"),dialog=document.getElementById("dialog"),details=document.getElementById("details");
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function draw(){const q=document.getElementById("search").value.trim().toLowerCase();cards.replaceChildren();const found=recipes.filter(r=>(current==="全部"||r.category===current)&&[r.title,r.englishTitle,...r.ingredients.flat()].join(" ").toLowerCase().includes(q));if(!found.length){cards.append(el("p",current==="正餐"?"正餐菜谱正在收藏中。":"没有找到菜谱。","empty"));return}for(const r of found){const card=el("button",undefined,"tile"),photo=el("div",undefined,"photo");if(r.photo){const img=el("img");img.src=r.photo;img.alt=r.title+" 成品照片";photo.append(img);img.onerror=()=>{photo.replaceChildren(el("span","🥐"))}}else photo.append(el("span","🥐"));const body=el("div",undefined,"tilebody");body.append(el("div",r.category==="烘焙"?"BAKING · 烘焙":"MEALS · 正餐","tag"),el("h2",r.title),el("p",r.englishTitle+" · 成功配方"));const foot=el("div",undefined,"foot");foot.append(el("span",r.version+" ✓"),el("span",r.bakeTime||""));body.append(foot);card.append(photo,body);card.onclick=()=>openRecipe(r);cards.append(card)}}
function openRecipe(r){details.replaceChildren();const close=el("button","×","close");close.setAttribute("aria-label","关闭");close.onclick=()=>dialog.close();details.append(close,el("div",r.category+" · "+r.version+" · "+r.status,"eyebrow"),el("h2",r.title),el("p",r.englishTitle,"muted"));details.append(el("div",r.yield+" | "+r.temperature+" | "+r.bakeTime,"meta"));const two=el("div",undefined,"two"),left=el("section"),right=el("section");left.append(el("h3","食材 Ingredients"));const ul=el("ul");r.ingredients.forEach(([n,a])=>ul.append(el("li",n+" — "+a)));left.append(ul);right.append(el("h3","制作步骤 Method"));const ol=el("ol");r.steps.forEach(s=>ol.append(el("li",s)));right.append(ol);two.append(left,right);details.append(two,el("p",r.notes,"meta"));dialog.showModal()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{current=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));draw()});document.getElementById("search").oninput=draw;dialog.onclick=e=>{if(e.target===dialog)dialog.close()};draw();
</script></body></html>
